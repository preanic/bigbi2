<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Restaurant Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="slider">
    <img id="image_1" data-image="3/1.png" class="slide active">
    <img id="image_2" data-image="3/2.png" class="slide">
    <img id="image_3" data-image="3/3.png" class="slide">
    <img id="image_4" data-image="3/4.png" class="slide">
    <img id="image_5" data-image="3/5.png" class="slide">
    <img id="image_6" data-image="3/6.png" class="slide">
</div>

<div class="dots"></div>
<script src="slider.js"></script>

<script type="text/javascript">
  document.querySelectorAll('img[data-image]').forEach(img => {
    img.src = getImagePath(img.dataset.image);
  });

  function getImagePath(path) {
    const orientation = localStorage.getItem('menuOrientation') || 'landscape';

    return `screens/${orientation}/${path}`;
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Restaurant Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="bigbi_day_hidden_btn" href="bigbi_day.html">BIGBI дня</a>

  <div class="slider">
    <img src="screens/2/big_combo/1.png" id="bigComboImage" class="slide active">
    <img src="screens/2/bigbi_day/1.png" id="sandwichDayImage" class="slide">
    <img src="screens/2/meat_combo/1.png" id="meatComboImage" class="slide">
    <img src="screens/2/seafood_combo/1.png" id="seafoodComboImage" class="slide">
    <img src="screens/2/vc_combo/1.png" id="vcComboImage" class="slide">
  </div>

  <div class="dots"></div>

  <script type="text/javascript">
    const sandwichOfTheDay = localStorage.getItem('sandwichOfTheDay') || '1';
    document.querySelector('#sandwichDayImage').src = `screens/2/bigbi_day/${sandwichOfTheDay}.png`;
    // Ставим в комбо альтернативные сэндвичи, не совпадающие с BIGBI дня:
    switch (sandwichOfTheDay) {
      case '2':
        document.querySelector('#meatComboImage').src = `screens/2/meat_combo/2.png`;
        break;
      case '5':
        document.querySelector('#seafoodComboImage').src = `screens/2/seafood_combo/2.png`;
        break;
      case '10':
        document.querySelector('#vcComboImage').src = `screens/2/vc_combo/2.png`;
        break;
      case '3':
        document.querySelector('#bigComboImage').src = `screens/2/big_combo/2.png`;
        break;
    }
  </script>

  <script src="slider.js"></script>
</body>
</html>

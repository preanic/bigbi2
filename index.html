<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles-intro.css">
  </head>
  <body>
    <div class="main-container">
      <div class="header">
        <div class="title">
          ОРИЕНТАЦИЯ
        </div>
      </div>

      <div class="orientation-menu">
        <label>
          <input type="radio" name="orientation" value="landscape" checked>
          АЛЬБОМНАЯ
        </label>

        <label>
          <input type="radio" name="orientation" value="portrait">
          ПОРТРЕТНАЯ
        </label>
      </div>
      <button id="saveOrientationBtn">OK</button>
    </div>

    <script>
      const savedOrientation =
        localStorage.getItem('menuOrientation') || 'landscape';

      document.querySelector(
        `input[name="orientation"][value="${savedOrientation}"]`
      ).checked = true;

      document.getElementById('saveOrientationBtn').addEventListener('click', () => {
        const selected = document.querySelector(
            'input[name="orientation"]:checked'
        );

        localStorage.setItem('menuOrientation', selected.value);

        window.location.href = 'screen.html';
      });
    </script>
  </body>
</html>
